[project]
name = "novaconnect-ivr-engine"
version = "2.0.0"
description = "NovaConnect Telecoms conversational IVR engine — Sarvam AI voice pipeline (STT -> CRM -> LLM -> TTS)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "sarvamai>=0.1.33",
    "httpx>=0.27.0,<1.0.0",
    "redis>=5.0.0,<6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-redis",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.domain" = ["personas/*.md", "data/*.json"]

# ------------------------------------------------------------------------------
# Lint / format
# ------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "RUF"]
ignore = [
    "B008",  # FastAPI's Depends()/File()/Form() in defaults is the documented idiom.
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests", "evals"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

# ------------------------------------------------------------------------------
# Types
# ------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
# The sarvamai SDK ships no type stubs.
[[tool.mypy.overrides]]
module = ["sarvamai.*"]
ignore_missing_imports = true

# ------------------------------------------------------------------------------
# Tests
# ------------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]
